<body>

      StudyHelp <span class="sh-pill gray ms-2">Admin</span>

    <div class="dropdown">
      <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false">

<div class="sh-dashboard-layout">
<div class="sh-sidebar p-3">
    <a href="index.html" class="sh-side-link mb-1"><i class="bi bi-house-door"></i> Início</a>
    <a href="admin.html" class="sh-side-link mb-1"><i class="bi bi-grid-1x2-fill"></i> Visão geral</a>
    <a href="admin-usuarios.html" class="sh-side-link mb-1 active"><i class="bi bi-people"></i> Usuários</a>
    <a href="admin-solicitacoes.html" class="sh-side-link mb-1"><i class="bi bi-person-check"></i> Solicitações</a>
    <a href="admin-tutores.html" class="sh-side-link mb-1"><i class="bi bi-mortarboard"></i> Tutores</a>
    <a href="admin-materias.html" class="sh-side-link mb-1"><i class="bi bi-journal-bookmark"></i> Matérias</a>
    <a href="admin-relatorios.html" class="sh-side-link mb-1"><i class="bi bi-bar-chart"></i> Relatórios</a>

    <a href="index.html" class="sh-side-link" onclick="shLogout()"><i class="bi bi-box-arrow-right"></i> Sair</a>
  </div>
  <div class="flex-grow-1 p-4" style="background:#FBFCFA">
    <h1 class="h4 mb-1">Usuários</h1>
    <p class="sh-muted mb-3">Todos os usuários cadastrados na plataforma.</p>
    <div class="sh-card p-3">
      <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <h2 class="h6 mb-0">Usuários da plataforma</h2>
        <input id="busca-usuario" class="form-control sh-search" style="max-width:220px" placeholder="Pesquisar usuário...">
      </div>
      <table class="table align-middle mb-0" style="font-size:.88rem">
        <thead><tr class="sh-muted"><th>Nome</th><th>Email</th><th>Papel</th><th>Status</th><th></th></tr></thead>
        <tbody id="tabela-usuarios"></tbody>
      </table>
      <p id="usuarios-vazio" class="sh-muted text-center py-4 d-none">Nenhum usuário encontrado.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

<script>
  // Bloqueia quem digitar essa URL direto sem ter passado pela senha administrativa
  const u = shGetUser();
  if (u.papel !== 'Administrador') window.location.href = 'admin-login.html';
</script>

<script>
  function pillPapel(papel) {
    if (papel === 'Tutor') return '<span class="sh-pill purple">Tutor</span>';
    if (papel === 'Administrador') return '<span class="sh-pill gray">Admin</span>';
    return '<span class="sh-pill gray">Aluno</span>';
  }
  function pillStatus(status) {
    if (status === 'Pendente') return '<span class="sh-pill warn">Pendente</span>';
    if (status === 'Recusado') return '<span class="sh-pill" style="background:#fde2e2;color:#b42318">Recusado</span>';
    return '<span class="sh-pill">Ativo</span>';
  }

  function renderUsuarios() {
    const termo = document.getElementById('busca-usuario').value.trim().toLowerCase();
    const lista = shGetUsuarios().filter(u => !termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo));
    const corpo = document.getElementById('tabela-usuarios');
    corpo.innerHTML = '';
    document.getElementById('usuarios-vazio').classList.toggle('d-none', lista.length > 0);

    lista.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.nome}</td>
        <td class="sh-muted">${u.email}</td>
        <td>${pillPapel(u.papel)}</td>
        <td>${pillStatus(u.status)}</td>
        <td class="text-end"><i class="bi bi-trash text-danger" style="cursor:pointer" data-del="${u.id}"></i></td>`;
      corpo.appendChild(tr);
    });

    document.querySelectorAll('[data-del]').forEach(icon => {
      icon.addEventListener('click', function () {
        if (!confirm('Remover esse usuário da plataforma?')) return;
        const id = this.dataset.del;
        const lista2 = shGetUsuarios();
        const alvo = lista2.find(x => x.id === id);
        shSalvarUsuarios(lista2.filter(x => x.id !== id));
        if (alvo) shAdicionarAtividade(`Usuário ${alvo.nome} foi removido da plataforma`);
        renderUsuarios();
      });
    });
  }

  document.getElementById('busca-usuario').addEventListener('input', renderUsuarios);
  renderUsuarios();
</script>
</body>
</html>
