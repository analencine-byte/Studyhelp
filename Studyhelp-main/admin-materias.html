      StudyHelp <span class="sh-pill gray ms-2">Admin</span>
    </a>
    <div class="dropdown">
      <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false">

        <i class="bi bi-chevron-down sh-muted" style="font-size:.75rem"></i>

<div class="sh-dashboard-layout">
<div class="sh-sidebar p-3">
    <a href="index.html" class="sh-side-link mb-1"><i class="bi bi-house-door"></i> Início</a>
    <a href="admin.html" class="sh-side-link mb-1"><i class="bi bi-grid-1x2-fill"></i> Visão geral</a>
    <a href="admin-usuarios.html" class="sh-side-link mb-1"><i class="bi bi-people"></i> Usuários</a>
    <a href="admin-solicitacoes.html" class="sh-side-link mb-1"><i class="bi bi-person-check"></i> Solicitações</a>
    <a href="admin-tutores.html" class="sh-side-link mb-1"><i class="bi bi-mortarboard"></i> Tutores</a>
    <a href="admin-materias.html" class="sh-side-link mb-1 active"><i class="bi bi-journal-bookmark"></i> Matérias</a>
    <a href="admin-relatorios.html" class="sh-side-link mb-1"><i class="bi bi-bar-chart"></i> Relatórios</a>
    <a href="admin-config.html" class="sh-side-link mb-1"><i class="bi bi-gear"></i> Configurações</a>
    <hr>
    <a href="index.html" class="sh-side-link" onclick="shLogout()"><i class="bi bi-box-arrow-right"></i> Sair</a>
  </div>
  <div class="flex-grow-1 p-4" style="background:#FBFCFA">
    <h1 class="h4 mb-1">Matérias</h1>
    <p class="sh-muted mb-3">Gerencie as matérias disponíveis na plataforma.</p>
    <div class="sh-card p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Matérias cadastradas</h2>
        <button class="btn btn-sh-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalMateria"><i class="bi bi-plus-lg"></i> Nova matéria</button>
      </div>
      <table class="table align-middle mb-0" style="font-size:.88rem">
        <tbody id="tabela-materias"></tbody>
      </table>
      <p id="materias-vazio" class="sh-muted text-center py-4 d-none">Nenhuma matéria cadastrada ainda.</p>
    </div>

    <div class="modal fade" id="modalMateria" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content" style="border-radius:14px">
          <div class="modal-header">
            <h5 class="modal-title">Nova matéria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="form-label fw-semibold" style="font-size:.88rem">Nome da matéria</label>
            <input class="form-control sh-search" id="nova-materia-nome" placeholder="Ex: Geografia">
          </div>
          <div class="modal-footer">
            <button class="btn btn-sh-outline btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-sh-primary btn-sm" id="btn-criar-materia">Criar matéria</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

<script>
  // Bloqueia quem digitar essa URL direto sem ter passado pela senha administrativa
  const u = shGetUser();
  if (u.papel !== 'Administrador') window.location.href = 'admin-login.html';
</script>

<script>
  function renderMaterias() {
    const lista = shGetMaterias();
    const corpo = document.getElementById('tabela-materias');
    corpo.innerHTML = '';
    document.getElementById('materias-vazio').classList.toggle('d-none', lista.length > 0);

    lista.forEach((m, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${m.nome}</td>
        <td class="sh-muted">${m.alunos} alunos</td>
        <td class="text-end"><i class="bi bi-trash text-danger" style="cursor:pointer" data-del="${i}"></i></td>`;
      corpo.appendChild(tr);
    });

    document.querySelectorAll('[data-del]').forEach(icon => {
      icon.addEventListener('click', function () {
        if (!confirm('Remover essa matéria?')) return;
        const idx = parseInt(this.dataset.del, 10);
        const lista2 = shGetMaterias();
        const nome = lista2[idx] ? lista2[idx].nome : '';
        lista2.splice(idx, 1);
        shSalvarMaterias(lista2);
        if (nome) shAdicionarAtividade(`Matéria "${nome}" foi removida`);
        renderMaterias();
      });
    });
  }

  document.getElementById('btn-criar-materia').addEventListener('click', function () {
    const nome = document.getElementById('nova-materia-nome').value.trim();
    if (!nome) { alert('Escreva o nome da matéria.'); return; }
    const lista = shGetMaterias();
    lista.push({ nome, alunos: 0 });
    shSalvarMaterias(lista);
    shAdicionarAtividade(`Matéria "${nome}" foi criada`);
    document.getElementById('nova-materia-nome').value = '';
    bootstrap.Modal.getInstance(document.getElementById('modalMateria')).hide();
    renderMaterias();
  });

  renderMaterias();
</script>
</body>
</html>
