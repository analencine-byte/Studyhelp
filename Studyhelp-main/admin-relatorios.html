<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — StudyHelp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="sh-navbar">
  <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
    <a href="index.html" class="sh-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 6C10 4.5 6.5 4 3 4v13c3.5 0 7 .5 9 2 2-1.5 5.5-2 9-2V4c-3.5 0-7 .5-9 2Z" fill="#2E7D32"/></svg>
      StudyHelp <span class="sh-pill gray ms-2">Admin</span>
    </a>
    <div class="dropdown">
      <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="https://i.pravatar.cc/80?img=68" class="sh-avatar sh-user-avatar" style="width:36px;height:36px">
        <span style="font-size:.9rem">Olá, <span class="sh-user-firstname">Admin</span></span>
        <i class="bi bi-chevron-down sh-muted" style="font-size:.75rem"></i>
      </div>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2" style="border-radius:12px;border-color:var(--sh-border)">
        <li><a class="dropdown-item" href="perfil.html"><i class="bi bi-person me-2"></i>Meu perfil</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="index.html" onclick="shLogout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="sh-dashboard-layout">
<div class="sh-sidebar p-3">
    <a href="index.html" class="sh-side-link mb-1"><i class="bi bi-house-door"></i> Início</a>
    <a href="admin.html" class="sh-side-link mb-1"><i class="bi bi-grid-1x2-fill"></i> Visão geral</a>
    <a href="admin-usuarios.html" class="sh-side-link mb-1"><i class="bi bi-people"></i> Usuários</a>
    <a href="admin-solicitacoes.html" class="sh-side-link mb-1"><i class="bi bi-person-check"></i> Solicitações</a>
    <a href="admin-tutores.html" class="sh-side-link mb-1"><i class="bi bi-mortarboard"></i> Tutores</a>
    <a href="admin-materias.html" class="sh-side-link mb-1"><i class="bi bi-journal-bookmark"></i> Matérias</a>
    <a href="admin-relatorios.html" class="sh-side-link mb-1 active"><i class="bi bi-bar-chart"></i> Relatórios</a>
    <a href="admin-config.html" class="sh-side-link mb-1"><i class="bi bi-gear"></i> Configurações</a>
    <hr>
    <a href="index.html" class="sh-side-link" onclick="shLogout()"><i class="bi bi-box-arrow-right"></i> Sair</a>
  </div>
  <div class="flex-grow-1 p-4" style="background:#FBFCFA">
    <h1 class="h4 mb-1">Relatórios</h1>
    <p class="sh-muted mb-3">Acompanhamento geral da plataforma.</p>
    <div class="row g-3 mb-4" id="kpis-relatorio"></div>
    <div class="sh-card p-3">
      <h2 class="h6 mb-2">Histórico de atividades</h2>
      <div id="lista-atividades-completa"></div>
      <p id="atividades-vazio" class="sh-muted text-center py-4 d-none">Nenhuma atividade registrada ainda.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

<script>
  // Bloqueia quem digitar essa URL direto sem ter passado pela senha administrativa
  const u = shGetUser();
  if (u.papel !== 'Administrador') window.location.href = 'admin-login.html';
</script>

<script>
  function renderKPIsRelatorio() {
    const usuarios = shGetUsuarios();
    const pendentes = usuarios.filter(u => u.status === 'Pendente').length;
    const recusados = usuarios.filter(u => u.status === 'Recusado').length;
    document.getElementById('kpis-relatorio').innerHTML = `
      <div class="col-6 col-md-3"><div class="sh-card p-3"><div class="sh-muted" style="font-size:.8rem">Usuários totais</div><div class="h4 mb-0">${usuarios.length}</div></div></div>
      <div class="col-6 col-md-3"><div class="sh-card p-3"><div class="sh-muted" style="font-size:.8rem">Matérias</div><div class="h4 mb-0">${shGetMaterias().length}</div></div></div>
      <div class="col-6 col-md-3"><div class="sh-card p-3"><div class="sh-muted" style="font-size:.8rem">Pendentes</div><div class="h4 mb-0">${pendentes}</div></div></div>
      <div class="col-6 col-md-3"><div class="sh-card p-3"><div class="sh-muted" style="font-size:.8rem">Recusados</div><div class="h4 mb-0">${recusados}</div></div></div>`;
  }

  function renderAtividades() {
    const lista = shGetAtividades();
    const cont = document.getElementById('lista-atividades-completa');
    cont.innerHTML = '';
    document.getElementById('atividades-vazio').classList.toggle('d-none', lista.length > 0);
    lista.forEach(a => {
      const div = document.createElement('div');
      div.className = 'd-flex justify-content-between py-2 border-bottom';
      div.style.fontSize = '.85rem';
      div.style.cursor = 'pointer';
      div.innerHTML = `<span>${a.texto}</span><span class="sh-muted">${a.tempo}</span>`;
      div.addEventListener('click', () => alert(a.texto + '\n\n' + a.tempo));
      cont.appendChild(div);
    });
  }

  renderKPIsRelatorio();
  renderAtividades();
</script>
</body>
</html>
