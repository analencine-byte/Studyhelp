<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações — StudyHelp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="sh-navbar">
  <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
    <a href="index.html" class="sh-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 6C10 4.5 6.5 4 3 4v13c3.5 0 7 .5 9 2 2-1.5 5.5-2 9-2V4c-3.5 0-7 .5-9 2Z" fill="#2E7D32"/></svg>
      StudyHelp <span class="sh-pill gray ms-2">Admin</span>
    </a>
    <div class="dropdown">
      <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="https://i.pravatar.cc/80?img=68" class="sh-avatar sh-user-avatar" style="width:36px;height:36px">
        <span style="font-size:.9rem">Olá, <span class="sh-user-firstname">Admin</span></span>
        <i class="bi bi-chevron-down sh-muted" style="font-size:.75rem"></i>
      </div>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2" style="border-radius:12px;border-color:var(--sh-border)">
        <li><a class="dropdown-item" href="perfil.html"><i class="bi bi-person me-2"></i>Meu perfil</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="index.html" onclick="shLogout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="sh-dashboard-layout">
<div class="sh-sidebar p-3">
    <a href="index.html" class="sh-side-link mb-1"><i class="bi bi-house-door"></i> Início</a>
    <a href="admin.html" class="sh-side-link mb-1"><i class="bi bi-grid-1x2-fill"></i> Visão geral</a>
    <a href="admin-usuarios.html" class="sh-side-link mb-1"><i class="bi bi-people"></i> Usuários</a>
    <a href="admin-solicitacoes.html" class="sh-side-link mb-1"><i class="bi bi-person-check"></i> Solicitações</a>
    <a href="admin-tutores.html" class="sh-side-link mb-1"><i class="bi bi-mortarboard"></i> Tutores</a>
    <a href="admin-materias.html" class="sh-side-link mb-1"><i class="bi bi-journal-bookmark"></i> Matérias</a>
    <a href="admin-relatorios.html" class="sh-side-link mb-1"><i class="bi bi-bar-chart"></i> Relatórios</a>
    <a href="admin-config.html" class="sh-side-link mb-1 active"><i class="bi bi-gear"></i> Configurações</a>
    <hr>
    <a href="index.html" class="sh-side-link" onclick="shLogout()"><i class="bi bi-box-arrow-right"></i> Sair</a>
  </div>
  <div class="flex-grow-1 p-4" style="background:#FBFCFA">
    <h1 class="h4 mb-1">Configurações</h1>
    <p class="sh-muted mb-3">Preferências gerais da plataforma.</p>
    <div class="sh-card p-4">
      <h2 class="h6 mb-3">Configurações da plataforma</h2>
      <form id="form-config-admin">
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:.88rem">Nome da plataforma</label>
          <input class="form-control sh-search" value="StudyHelp">
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label sh-muted" style="font-size:.88rem">Aprovar tutores manualmente antes de liberar o painel</label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label sh-muted" style="font-size:.88rem">Notificar admin por email a cada novo cadastro</label>
        </div>
        <button class="btn btn-sh-primary btn-sm" type="submit">Salvar configurações</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

<script>
  // Bloqueia quem digitar essa URL direto sem ter passado pela senha administrativa
  const u = shGetUser();
  if (u.papel !== 'Administrador') window.location.href = 'admin-login.html';
</script>

<script>
  document.getElementById('form-config-admin').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Configurações salvas (simulação) — conectar ao backend.');
  });
</script>
</body>
</html>
