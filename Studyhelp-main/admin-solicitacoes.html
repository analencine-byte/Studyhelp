      StudyHelp <span class="sh-pill gray ms-2">Admin</span>
    </a>
    <div class="dropdown">
      <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="https://i.pravatar.cc/80?img=68" class="sh-avatar sh-user-avatar" style="width:36px;height:36px">

      </ul>

  </div>
</nav>

<div class="sh-dashboard-layout">
<div class="sh-sidebar p-3">
    <a href="index.html" class="sh-side-link mb-1"><i class="bi bi-house-door"></i> Início</a>
    <a href="admin.html" class="sh-side-link mb-1"><i class="bi bi-grid-1x2-fill"></i> Visão geral</a>
    <a href="admin-usuarios.html" class="sh-side-link mb-1"><i class="bi bi-people"></i> Usuários</a>
    <a href="admin-solicitacoes.html" class="sh-side-link mb-1 active"><i class="bi bi-person-check"></i> Solicitações</a>
    <a href="admin-tutores.html" class="sh-side-link mb-1"><i class="bi bi-mortarboard"></i> Tutores</a>
    <a href="admin-materias.html" class="sh-side-link mb-1"><i class="bi bi-journal-bookmark"></i> Matérias</a>
    <a href="admin-relatorios.html" class="sh-side-link mb-1"><i class="bi bi-bar-chart"></i> Relatórios</a>

    <hr>
    <a href="index.html" class="sh-side-link" onclick="shLogout()"><i class="bi bi-box-arrow-right"></i> Sair</a>
  </div>
  <div class="flex-grow-1 p-4" style="background:#FBFCFA">
    <h1 class="h4 mb-1">Solicitações de cadastro</h1>
    <p class="sh-muted mb-3">Aprove ou recuse novos cadastros de tutores e alunos.</p>
    <div class="sh-card p-3">
      <div id="lista-solicitacoes-completa"></div>
      <p id="solicitacoes-vazio" class="sh-muted text-center py-4 d-none">Nenhuma solicitação pendente 🎉</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

<script>
  // Bloqueia quem digitar essa URL direto sem ter passado pela senha administrativa
  const u = shGetUser();
  if (u.papel !== 'Administrador') window.location.href = 'admin-login.html';
</script>

<script>
  function renderSolicitacoes() {
    const pendentes = shGetUsuarios().filter(u => u.status === 'Pendente');
    const cont = document.getElementById('lista-solicitacoes-completa');
    cont.innerHTML = '';
    document.getElementById('solicitacoes-vazio').classList.toggle('d-none', pendentes.length > 0);

    pendentes.forEach(u => {
      const div = document.createElement('div');
      div.className = 'd-flex justify-content-between align-items-center py-2 border-bottom';
      div.innerHTML = `
        <div><div class="fw-semibold" style="font-size:.9rem">${u.nome}</div><div class="sh-muted" style="font-size:.78rem">${u.email} · Solicitou como: ${u.papel}</div></div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-sh-primary" data-aprovar="${u.id}"><i class="bi bi-check-lg"></i></button>
          <button class="btn btn-sm btn-outline-danger" data-recusar="${u.id}"><i class="bi bi-x-lg"></i></button>
        </div>`;
      cont.appendChild(div);
    });

    document.querySelectorAll('[data-aprovar]').forEach(btn => btn.addEventListener('click', function () {
      const lista = shGetUsuarios();
      const u = lista.find(x => x.id === this.dataset.aprovar);
      if (!u) return;
      u.status = 'Aprovado';
      shSalvarUsuarios(lista);
      shAdicionarAtividade(`${u.nome} foi aprovado(a) como ${u.papel.toLowerCase()}`);
      const contaAtual = shGetUser();
      if (contaAtual.email === u.email) shIniciarSessao(u.papel, 'Aprovado');
      renderSolicitacoes();
    }));
    document.querySelectorAll('[data-recusar]').forEach(btn => btn.addEventListener('click', function () {
      const lista = shGetUsuarios();
      const u = lista.find(x => x.id === this.dataset.recusar);
      if (!u) return;
      u.status = 'Recusado';
      shSalvarUsuarios(lista);
      shAdicionarAtividade(`Cadastro de ${u.nome} foi recusado`);
      renderSolicitacoes();
    }));
  }
  renderSolicitacoes();
</script>
</body>
</html>
