<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Administrativo — StudyHelp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
  <a href="index.html" class="sh-nav-link"><i class="bi bi-arrow-left"></i> Voltar para o início</a>
</div>

<div class="container pb-5" style="max-width:420px">
  <div class="sh-card p-4 p-md-5">
    <div class="sh-icon-badge purple mx-auto mb-3" style="width:56px;height:56px;font-size:1.4rem"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="h4 text-center mb-1">Acesso Administrativo</h1>
    <p class="sh-muted text-center mb-4" style="font-size:.88rem">Área restrita ao administrador da plataforma.</p>

    <form id="form-admin-login">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.9rem">Email de administrador</label>
        <input type="email" id="admin-email" class="form-control sh-search" placeholder="admin@studyhelp.com" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.9rem">Senha de administrador</label>
        <input type="password" id="admin-senha" class="form-control sh-search" placeholder="••••••••" required>
      </div>
      <div id="admin-erro" class="text-danger d-none mb-3" style="font-size:.85rem"><i class="bi bi-exclamation-circle-fill"></i> <span id="admin-erro-texto">Email ou senha incorretos.</span></div>
      <button class="btn btn-sh-primary w-100" type="submit">Entrar como administrador</button>
    </form>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  // A senha é conferida no servidor (api/auth.php). Só contas com papel "Administrador" passam.
  document.getElementById('form-admin-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    const erro = document.getElementById('admin-erro');
    const r = await shApi('auth.php', { acao: 'login', corpo: {
      email: document.getElementById('admin-email').value.trim(),
      senha: document.getElementById('admin-senha').value
    }});
    if (!r.ok || r.usuario.papel !== 'Administrador') {
      if (r.ok) shApi('auth.php', { acao: 'logout', corpo: {} }); // era conta comum: não deixa sessão aberta
      document.getElementById('admin-erro-texto').textContent = r.ok ? 'Esta conta não é de administrador.' : (r.erro || 'Email ou senha incorretos.');
      erro.classList.remove('d-none');
      return;
    }
    shGuardarUsuario(r.usuario);
    window.location.href = 'admin.html';
  });
</script>
</body>
</html>
