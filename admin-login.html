<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Administrativo — StudyHelp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
  <a href="index.html" class="sh-nav-link"><i class="bi bi-arrow-left"></i> Voltar para o início</a>
</div>

<div class="container pb-5" style="max-width:420px">
  <div class="sh-card p-4 p-md-5">
    <div class="sh-icon-badge purple mx-auto mb-3" style="width:56px;height:56px;font-size:1.4rem"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="h4 text-center mb-1">Acesso Administrativo</h1>
    <p class="sh-muted text-center mb-4" style="font-size:.88rem">Área restrita ao administrador da plataforma.</p>

    <form id="form-admin-login">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.9rem">Senha de administrador</label>
        <input type="password" id="admin-senha" class="form-control sh-search" placeholder="••••••••" required autofocus>
      </div>
      <div id="admin-erro" class="text-danger d-none mb-3" style="font-size:.85rem"><i class="bi bi-exclamation-circle-fill"></i> Senha incorreta. Tente novamente.</div>
      <button class="btn btn-sh-primary w-100" type="submit">Entrar como administrador</button>
    </form>
  </div>

  <p class="sh-muted text-center mt-3" style="font-size:.75rem">
    Esta senha é só uma simulação para o protótipo. No sistema final, essa verificação deve acontecer no servidor (PHP), nunca só no navegador.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  // ATENÇÃO: senha fixa só para demonstração do protótipo (front-end).
  // Qualquer pessoa que abrir o código-fonte desta página consegue ver essa senha.
  // Quando o backend em PHP/MySQL estiver pronto, troquem por autenticação real
  // no servidor (usuário com papel "administrador" verificado no banco de dados).
  const SENHA_ADMIN_DEMO = 'studyhelp2026';

  document.getElementById('form-admin-login').addEventListener('submit', function (e) {
    e.preventDefault();
    const senha = document.getElementById('admin-senha').value;

    if (senha === SENHA_ADMIN_DEMO) {
      const salvou = shIniciarSessao('Administrador', 'Aprovado');
      if (!salvou) {
        alert('Seu navegador bloqueou o armazenamento da sessão (comum quando o arquivo é aberto direto, sem servidor local). O painel vai abrir, mas as abas internas podem te devolver pra essa tela. Rode o projeto por um servidor local (ex: extensão Live Server, ou dentro do XAMPP) pra resolver de vez.');
      }
      window.location.href = 'admin.html';
    } else {
      document.getElementById('admin-erro').classList.remove('d-none');
    }
  });
</script>
</body>
</html>
